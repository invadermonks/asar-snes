name: CMake

on:
  workflow_dispatch:
  push:
    branches: [ master, asar_19, asar_2_beta ]
  pull_request:
    branches: [ master, asar_19, asar_2_beta ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: MinSizeRel

jobs:
  build:
    strategy:
      matrix:
        include:
          - name: win64
            os: windows-2022
            cmake_opts: '-G "Visual Studio 17 2022"'
            upload_artifacts: true
          - name: win32
            os: windows-2022
            cmake_opts: '-G "Visual Studio 17 2022" -A Win32'
            upload_artifacts: true
          - name: ubuntu-sanitizer
            os: ubuntu-24.04
            cmake_opts: '-DASAR_USE_SANITIZER=ON'
            upload_artifacts: false
          - name: linux64
            os: ubuntu-24.04
            cmake_opts: ''
            upload_artifacts: true
          - name: macos
            os: macos-14
            cmake_opts: ''
            upload_artifacts: true
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Configure CMake
      run: cmake -S ${{github.workspace}}/src -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} ${{ matrix.cmake_opts }}

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    # Uncomment this to get a debug shell on the actions runner
    #- name: debug stuff
    #  uses: mxschmitt/action-tmate@v3

    - name: Tests
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --target run-tests

    - name: Upload Windows Binaries
      if: ${{ matrix.upload_artifacts && (matrix.name == 'win64' || matrix.name == 'win32') }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.name }}-binaries
        path: |
          ${{ github.workspace }}/build/asar/bin/**/asar.exe
          ${{ github.workspace }}/build/asar/lib/**/asar.dll

    - name: Upload Linux Binaries
      if: ${{ matrix.upload_artifacts && matrix.name == 'linux64' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.name }}-binaries
        path: |
          ${{ github.workspace }}/build/asar/bin/**/asar
          ${{ github.workspace }}/build/asar/lib/**/libasar.so

    - name: Upload macOS Binaries
      if: ${{ matrix.upload_artifacts && matrix.name == 'macos' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.name }}-binaries
        path: |
          ${{ github.workspace }}/build/asar/bin/**/asar
          ${{ github.workspace }}/build/asar/lib/**/libasar.dylib
